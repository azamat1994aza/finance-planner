async function dbLoad() {
  try {
    const { data, error } = await supabase
      .from("planner_data")
      .select("data")
      .eq("user_id", USER_ID)
      .single();
    if (error) { console.error("Load error:", error.message); return null; }
    return data?.data ? JSON.parse(data.data) : null;
  } catch(e) {
    console.error("Load error:", e.message);
    return null;
  }
}

async function dbSave(payload) {
  const { error } = await supabase
    .from("planner_data")
    .upsert({ user_id: USER_ID, data: JSON.stringify(payload), updated_at: new Date().toISOString() });
  if (error) {
    console.error("Save error:", error.message);
    throw new Error(error.message);
  }
}

    <div style={{display:"flex",alignItems:"center",gap:10}}>
      {fin.type==="planned"

        : <div style={{width:28,height:28,borderRadius:"50%",background:typeColor+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>{fin.type==="income"?"↑":"↓"}</div>

      <div style={{width:34,height:34,borderRadius:11,background:cat.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{cat.emoji}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,textDecoration:fin.paid&&fin.type==="planned"?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{fin.label}</div>
        <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:10,opacity:0.35}}>{fin.date}</span>
          {fin.note&&<span style={{fontSize:10,opacity:0.3}}>· {fin.note}</span>}
          {fin.type==="planned"&&<span style={{fontSize:9,background:fin.paid?"rgba(67,233,122,0.15)":"rgba(96,165,250,0.12)",color:fin.paid?"#43e97b":"#60A5FA",borderRadius:5,padding:"1px 6px",fontWeight:600}}>{fin.paid?"Оплачено":"Запланировано"}</span>}

      deposits:     patch.deposits     ?? deposits,
      monthlyIncomes: patch.monthlyIncomes ?? monthlyIncomes,
    };
    setSaveStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      dbSave(data).then(()=>{
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(""),1500);
      }).catch(e=>{
        const msg = e.message||"unknown";
        alert("Ошибка сохранения:\n"+msg);
        setSaveStatus("⚠️ "+msg.slice(0,40));
        setTimeout(()=>setSaveStatus(""),8000);
      });
    }, 800);
  }

  // ── Finance helpers ────────────────────────────────
  const mFin   = finances.filter(f=>f.month===currentMonth);
  const mTasks = tasks.filter(t=>t.month===currentMonth);
  const allExp = mFin.filter(f=>f.type==="expense");
  const allPln = mFin.filter(f=>f.type==="planned");
  const allInc = mFin.filter(f=>f.type==="income");
  const totalSpent   = allExp.reduce((s,f)=>s+f.amount,0);
  const totalPlanned = allPln.reduce((s,f)=>s+f.amount,0);
  const totalIncome  = allInc.reduce((s,f)=>s+f.amount,0);
  const paidPlanned  = allPln.filter(f=>f.paid).reduce((s,f)=>s+f.amount,0);
  const unpaidTotal  = allPln.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0)+totalSpent;
  const grandNeed    = totalPlanned+totalSpent;
  const grandPaid    = paidPlanned+totalSpent;
  const grandPct     = grandNeed>0?Math.min((grandPaid/grandNeed)*100,100):0;
  const tasksDone    = mTasks.filter(t=>t.status==="Готово").length;
  const curMonthIncome = monthlyIncomes[currentMonth]||{sources:[],total:0};

  function saveMonthIncome(sources){
    const total=sources.reduce((s,x)=>s+Number(x.amount||0),0);
    const updated={...monthlyIncomes,[currentMonth]:{sources,total}};
    setMonthlyIncomes(updated); save({monthlyIncomes:updated});
  }

  const displayedRaw = filterType==="all"?mFin:mFin.filter(f=>f.type===filterType);
  const displayed    = [...displayedRaw].sort((a,b)=>sortBy==="amount"?b.amount-a.amount:(a.date||"").localeCompare(b.date||""));

  function addFinance(){
    if(!newFin.label||!newFin.amount) return;
    const u=[...finances,{...newFin,id:Date.now(),amount:Number(newFin.amount),paid:newFin.type==="expense",month:currentMonth}];
    setFinances(u); save({finances:u});
    setNewFin({type:"planned",cat:"credit",label:"",amount:"",date:today.toISOString().split("T")[0],note:""});
    setShowAddFin(false);
  }
  function togglePaid(id){ const u=finances.map(f=>f.id===id?{...f,paid:!f.paid}:f); setFinances(u); save({finances:u}); }
  function deleteFin(id) { const u=finances.filter(f=>f.id!==id); setFinances(u); save({finances:u}); }
  function saveEditFin(){
    if(!editFin) return;
    const u=finances.map(f=>f.id===editFin.id?{...editFin,amount:Number(editFin.amount)}:f);
    setFinances(u); save({finances:u}); setEditFin(null);
  }
  function addTask(){
    if(!newTask.text) return;
    const u=[...tasks,{...newTask,id:Date.now(),status:"Не начато",month:currentMonth}];
    setTasks(u); save({tasks:u}); setNewTask({text:"",category:"Личное",note:""}); setShowAddTask(false);
  }
  function cycleStatus(id){
    const c=["Не начато","В процессе","Готово"];
    const u=tasks.map(t=>t.id===id?{...t,status:c[(c.indexOf(t.status)+1)%3]}:t);
    setTasks(u); save({tasks:u});
  }
  function deleteTask(id){ const u=tasks.filter(t=>t.id!==id); setTasks(u); save({tasks:u}); }

  function openRollover(){
    setRolloverSel({
      finances:mFin.filter(f=>f.type==="planned"&&!f.paid).map(f=>f.id),
      tasks:mTasks.filter(t=>t.status!=="Готово").map(t=>t.id)
    });
    setShowRollover(true);
  }
  function doRollover(){
    const nm=currentMonth+1;
    const newF=[...finances,...finances.filter(f=>rolloverSel.finances.includes(f.id)).map(f=>({...f,id:Date.now()+Math.random(),month:nm,paid:false,date:nextMonthDate(f.date)}))];
    const newT=[...tasks,...tasks.filter(t=>rolloverSel.tasks.includes(t.id)).map(t=>({...t,id:Date.now()+Math.random(),month:nm,status:"Не начато"}))];
    setFinances(newF); setTasks(newT); setCurrentMonth(nm);
    save({finances:newF,tasks:newT,currentMonth:nm});
    setShowRollover(false);
  }

  function saveGoal(){
    const u=goals.map(g=>g.id===editGoal.id?{...g,saved:Number(savedInput)||0,target:Number(targetInput)||0}:g);
    setGoals(u); save({goals:u}); setEditGoal(null);
  }
  function addPosition(){
    if(!newPos.ticker||!newPos.qty||!newPos.avgPrice) return;
    const u=[...positions,{...newPos,id:Date.now(),qty:Number(newPos.qty),avgPrice:Number(newPos.avgPrice),currentPrice:Number(newPos.currentPrice)||Number(newPos.avgPrice)}];
    setPositions(u); save({positions:u}); setNewPos({portfolio:"crypto",ticker:"",name:"",qty:"",avgPrice:"",currentPrice:"",platform:"Binance"}); setShowAddPos(false);
  }
  function deletePos(id){ const u=positions.filter(x=>x.id!==id); setPositions(u); save({positions:u}); }
  function saveEditPos(){
    const u=positions.map(x=>x.id===editPos.id?{...editPos,qty:Number(editPos.qty),avgPrice:Number(editPos.avgPrice),currentPrice:Number(editPos.currentPrice)}:x);
    setPositions(u); save({positions:u}); setEditPos(null);
  }
  function saveInvGoal(){
    const u=invGoals.map(g=>g.id===editInvGoal.id?{...editInvGoal,target:Number(editInvGoal.target),deposited:Number(editInvGoal.deposited)}:g);
    setInvGoals(u); save({invGoals:u}); setEditInvGoal(null);
  }

  const portfolioValue = pid => positions.filter(p=>p.portfolio===pid).reduce((s,p)=>s+p.qty*p.currentPrice,0);
  const portfolioPnL   = pid => positions.filter(p=>p.portfolio===pid).reduce((s,p)=>s+p.qty*(p.currentPrice-p.avgPrice),0);

  function saveDeposit(d) {
    const u = deposits.map(x=>x.id===d.id?{...d,amount:Number(d.amount)||0,target:Number(d.target)||0}:x);
    setDeposits(u); save({deposits:u}); setEditDeposit(null);
  }
  function addGoal() {
    if (!newGoal.text) return;
    const u = [...goals, {...newGoal, id:Date.now(), saved:Number(newGoal.saved)||0, target:Number(newGoal.target)||0}];
    setGoals(u); save({goals:u}); setShowAddGoal(false);
    setNewGoal({emoji:"🎯",text:"",sub:"",saved:0,target:0,isTenge:true});
  }
  function deleteGoal(id) {
    const u = goals.filter(g=>g.id!==id); setGoals(u); save({goals:u});
  }
  function addDeposit() {
    if (!newDeposit.name) return;
    const u = [...deposits, {...newDeposit, id:Date.now(), amount:Number(newDeposit.amount)||0, target:Number(newDeposit.target)||0}];
    setDeposits(u); save({deposits:u}); setShowAddDeposit(false);
    setNewDeposit({name:"",type:"otbasy",bank:"Otbasy Bank",amount:0,target:0,currency:"₸",note:""});
  }
  function deleteDeposit(id) {
    const u = deposits.filter(d=>d.id!==id); setDeposits(u); save({deposits:u});
  }

  const allTaskCats   = ["Все",...Object.keys(CAT_COLORS)];
  const filteredTasks = filterCat==="Все"?mTasks:mTasks.filter(t=>t.category===filterCat);
  const curPortfolio  = INV_PORTFOLIOS.find(p=>p.id===activePortfolio);
  const curPositions  = positions.filter(p=>p.portfolio===activePortfolio);
  const curInvGoal    = invGoals.find(g=>g.portfolio===activePortfolio);

  const gradients={
    dashboard:"linear-gradient(135deg,#667eea,#764ba2)",
    finance:  "linear-gradient(135deg,#11998e,#38ef7d)",
    tasks:    "linear-gradient(135deg,#4facfe,#00f2fe)",
    invest:   "linear-gradient(135deg,#A78BFA,#6d28d9)",
    goals:    "linear-gradient(135deg,#f7971e,#ffd200)",
    deposits: "linear-gradient(135deg,#F59E0B,#f59e0b99)",
  };

  if(loading) return <div style={{minHeight:"100vh",background:"#0f0f1a",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
    <div style={{fontSize:48}}>📊</div>
    <div style={{fontSize:16,fontWeight:700}}>Загружаю данные...</div>
    <div style={{fontSize:12,opacity:0.4}}>Синхронизация с облаком</div>
  </div>;

  return <div style={{minHeight:"100vh",background:"#0f0f1a",fontFamily:"-apple-system,sans-serif",color:"#fff",maxWidth:430,margin:"0 auto"}}>

    {/* Save badge */}
    {saveStatus&&<div style={{position:"fixed",top:14,right:16,zIndex:200,background:saveStatus==="error"?"#f5576c":saveStatus==="saving"?"rgba(255,255,255,0.2)":"#43e97b",color:saveStatus==="saved"?"#0a2018":"#fff",borderRadius:20,padding:"5px 14px",fontSize:11,fontWeight:700,boxShadow:"0 2px 12px rgba(0,0,0,0.3)"}}>
      {saveStatus==="saved"?"✓ Сохранено":saveStatus==="saving"?"💾 Сохраняю...":"⚠️ Ошибка"}
    </div>}

    {/* Header */}
    <div style={{background:gradients[tab],padding:"52px 24px 24px",borderRadius:"0 0 32px 32px",marginBottom:20}}>
      <div style={{fontSize:13,opacity:0.85,marginBottom:4}}>{MONTHS[today.getMonth()]} {today.getFullYear()}</div>
      {tab==="dashboard"&&<><div style={{fontSize:26,fontWeight:700}}>Привет! 👋</div><div style={{fontSize:13,opacity:0.8,marginTop:3}}>Держи всё под контролем</div></>}
      {tab==="finance"&&<>
        <div style={{fontSize:26,fontWeight:700}}>Финансы 💳</div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:10}}>
          <button onClick={()=>setCurrentMonth(m=>Math.max(0,m-1))} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:10,padding:"5px 14px",color:"#fff",cursor:"pointer",fontSize:16}}>‹</button>
          <div style={{flex:1,textAlign:"center",fontWeight:700,fontSize:15}}>{getMonthLabel(currentMonth)}</div>
          <button onClick={()=>setCurrentMonth(m=>m+1)} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:10,padding:"5px 14px",color:"#fff",cursor:"pointer",fontSize:16}}>›</button>
        </div>
        <div style={{marginTop:12,background:"rgba(0,0,0,0.2)",borderRadius:18,padding:"12px 16px"}}>
          <div style={{fontSize:11,opacity:0.65,marginBottom:4}}>НУЖНО ЗАКРЫТЬ</div>
          <div style={{fontSize:26,fontWeight:800}}>{fmt(grandNeed)} ₸</div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:3,fontSize:11,opacity:0.7}}>
            <span>Закрыто: {fmt(grandPaid)} ₸</span>
            <span style={{color:unpaidTotal>0?"#ffcb6b":"#a3ffcf"}}>Осталось: {fmt(unpaidTotal)} ₸</span>
          </div>
          <div style={{marginTop:8,background:"rgba(255,255,255,0.15)",borderRadius:99,height:7,overflow:"hidden"}}>
            <div style={{width:`${grandPct}%`,height:"100%",background:"rgba(255,255,255,0.9)",borderRadius:99}}/>
          </div>
        </div>
      </>}
      {tab==="tasks"&&<>
        <div style={{fontSize:26,fontWeight:700}}>Дела 📋</div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:10}}>
          <button onClick={()=>setCurrentMonth(m=>Math.max(0,m-1))} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:10,padding:"5px 14px",color:"#fff",cursor:"pointer",fontSize:16}}>‹</button>
          <div style={{flex:1,textAlign:"center",fontWeight:700,fontSize:15}}>{getMonthLabel(currentMonth)}</div>
          <button onClick={()=>setCurrentMonth(m=>m+1)} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:10,padding:"5px 14px",color:"#fff",cursor:"pointer",fontSize:16}}>›</button>
        </div>
      </>}
      {tab==="invest"&&<>
        <div style={{fontSize:26,fontWeight:700}}>Инвестиции 📈</div>
        <div style={{fontSize:13,opacity:0.7,marginTop:4}}>Обзор всех активов</div>
      </>}
      {tab==="goals"&&<div style={{fontSize:26,fontWeight:700}}>Долгосрочные цели 🎯</div>}
      {tab==="deposits"&&<div style={{fontSize:26,fontWeight:700}}>Вклады 🏦</div>}
    </div>

    <div style={{padding:"0 14px 100px"}}>

      {/* DASHBOARD */}
      {tab==="dashboard"&&<>
        <div style={{background:"linear-gradient(135deg,#11998e,#38ef7d)",borderRadius:24,padding:"16px 20px",marginBottom:12,color:"#0a2018"}}>
          <div style={{fontSize:11,fontWeight:600,opacity:0.65,marginBottom:6}}>ЗАКРЫТЬ В {getMonthLabel(currentMonth).toUpperCase()}</div>
          <div style={{fontSize:26,fontWeight:800}}>{fmt(grandNeed)} ₸</div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:3,fontSize:12,fontWeight:600}}>
            <span style={{opacity:0.7}}>Закрыто {fmt(grandPaid)} ₸</span>
            <span>Осталось {fmt(unpaidTotal)} ₸</span>
          </div>
          <div style={{marginTop:10,background:"rgba(0,0,0,0.15)",borderRadius:99,height:7,overflow:"hidden"}}>
            <div style={{width:`${grandPct}%`,height:"100%",background:"#0a2018",borderRadius:99}}/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
          <StatCard emoji="💚" label="Доход"   value={fmt(curMonthIncome.total)} sub="₸"  color="#43e97b"/>
          <StatCard emoji="📌" label="Платежи" value={allPln.filter(f=>!f.paid).length} sub="не опл." color="#60A5FA"/>
          <StatCard emoji="✅" label="Дела"    value={`${tasksDone}/${mTasks.length}`} sub="готово" color="#4facfe"/>
        </div>
        <div style={{background:"#1c1c2e",borderRadius:18,padding:"14px 16px",marginBottom:14,display:"flex",gap:10}}>
          {INV_PORTFOLIOS.map(p=>{ const val=portfolioValue(p.id); const pnl=portfolioPnL(p.id);
            return <div key={p.id} style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:18}}>{p.emoji}</div>
              <div style={{fontSize:13,fontWeight:700,color:p.color,marginTop:3}}>{fmt(val.toFixed(0))} {p.currency}</div>
              <div style={{fontSize:10,color:pnl>=0?"#43e97b":"#f5576c",marginTop:1}}>{pnl>=0?"+":""}{fmt(pnl.toFixed(0))}</div>
            </div>;
          })}
        </div>
        <SectionTitle>Срочные платежи</SectionTitle>
        {allPln.filter(f=>!f.paid).slice(0,3).map(f=><FinRow key={f.id} fin={f} onToggle={togglePaid} onDelete={deleteFin} onEdit={f=>setEditFin({...f})}/>)}
        {allPln.filter(f=>!f.paid).length===0&&<EmptyState emoji="🎉" text="Все платежи закрыты!"/>}
        <SectionTitle style={{marginTop:16}}>Ближайшие дела</SectionTitle>
        {mTasks.filter(t=>t.status!=="Готово").slice(0,3).map(t=><TaskRow key={t.id} task={t} onCycle={cycleStatus} onDelete={deleteTask}/>)}
      </>}

      {/* FINANCE */}
      {tab==="finance"&&<>
        {/* Income card */}
        <div style={{background:"linear-gradient(135deg,#0d2a1a,#1a3a2a)",border:"1px solid rgba(67,233,122,0.2)",borderRadius:22,padding:"16px 18px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",letterSpacing:1,marginBottom:6}}>ДОХОД В {getMonthLabel(currentMonth).toUpperCase()}</div>
              <div style={{fontSize:28,fontWeight:800,color:"#43e97b"}}>{fmt(curMonthIncome.total)} ₸</div>
              {curMonthIncome.sources.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
                {curMonthIncome.sources.map(s=><div key={s.id} style={{background:"rgba(67,233,122,0.1)",borderRadius:10,padding:"3px 10px",fontSize:11,color:"#43e97b"}}>{s.label}: {fmt(s.amount)} ₸</div>)}
              </div>}
              {curMonthIncome.sources.length===0&&<div style={{fontSize:12,opacity:0.35,marginTop:4}}>Нажми Изменить чтобы добавить</div>}
            </div>
            <button onClick={()=>{ setIncomeEdit({sources:[...(curMonthIncome.sources||[])]}); setShowIncomeEditor(true); }} style={{background:"rgba(67,233,122,0.15)",border:"1px solid rgba(67,233,122,0.35)",borderRadius:14,padding:"8px 14px",color:"#43e97b",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0,marginLeft:12}}>✏️ Изменить</button>
          </div>
          {curMonthIncome.total>0&&grandNeed>0&&<div style={{marginTop:12,paddingTop:12,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
              <span style={{opacity:0.45}}>Покрывает расходы:</span>
              <span style={{fontWeight:700,color:curMonthIncome.total>=grandNeed?"#43e97b":"#f7971e"}}>{((curMonthIncome.total/grandNeed)*100).toFixed(0)}%</span>
            </div>
            <div style={{background:"rgba(255,255,255,0.07)",borderRadius:99,height:6,overflow:"hidden"}}>
              <div style={{width:`${Math.min((curMonthIncome.total/grandNeed)*100,100)}%`,height:"100%",background:"linear-gradient(90deg,#43e97b,#38f9d7)",borderRadius:99}}/>
            </div>
            <div style={{fontSize:11,opacity:0.4,marginTop:5,textAlign:"right"}}>
              {curMonthIncome.total>=grandNeed?"Свободно: "+fmt(curMonthIncome.total-grandNeed)+" ₸ 🎉":"Не хватает: "+fmt(grandNeed-curMonthIncome.total)+" ₸"}
            </div>
          </div>}
        </div>

        {/* Type filter */}
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          {[{id:"all",label:"Все",emoji:"📊"},...FIN_TYPES].map(ft=><button key={ft.id} onClick={()=>setFilterType(ft.id)} style={{flex:1,background:filterType===ft.id?(ft.color||"#667eea")+"33":"#1c1c2e",border:filterType===ft.id?`1.5px solid ${ft.color||"#667eea"}`:"1.5px solid transparent",borderRadius:14,padding:"9px 4px",fontSize:10,fontWeight:600,color:"#fff",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <span style={{fontSize:16}}>{ft.emoji||"📊"}</span>{ft.label||"Все"}
          </button>)}
        </div>
        {/* Sort */}
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          {[{id:"date",label:"По дате",emoji:"📅"},{id:"amount",label:"По сумме",emoji:"💰"}].map(s=><button key={s.id} onClick={()=>setSortBy(s.id)} style={{flex:1,background:sortBy===s.id?"rgba(255,255,255,0.1)":"#1c1c2e",border:sortBy===s.id?"1.5px solid rgba(255,255,255,0.25)":"1.5px solid transparent",borderRadius:12,padding:"8px 10px",fontSize:12,fontWeight:sortBy===s.id?700:400,color:sortBy===s.id?"#fff":"rgba(255,255,255,0.4)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            {s.emoji} {s.label} {sortBy===s.id&&(s.id==="date"?"↑":"↓")}
          </button>)}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <button onClick={openRollover} style={{background:"rgba(247,151,30,0.15)",border:"1px solid rgba(247,151,30,0.4)",borderRadius:12,padding:"8px 14px",color:"#f7971e",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔄 Перенести на след. месяц</button>
          <AddBtn onClick={()=>setShowAddFin(true)} color="#38ef7d"/>
        </div>
        {displayed.length===0&&<EmptyState emoji="💳" text="Нет записей"/>}
        {displayed.map(f=><FinRow key={f.id} fin={f} onToggle={togglePaid} onDelete={deleteFin} onEdit={f=>setEditFin({...f})}/>)}
        {/* Totals */}
        <div style={{background:"#1c1c2e",borderRadius:20,padding:"16px 20px",marginTop:14,border:"1px solid rgba(255,255,255,0.06)"}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:10,letterSpacing:1}}>ИТОГО ЗА МЕСЯЦ</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            <div style={{textAlign:"center"}}><div style={{fontSize:10,opacity:0.4,marginBottom:3}}>Расходы</div><div style={{fontSize:14,fontWeight:800,color:"#f5576c"}}>−{fmt(totalSpent)}</div></div>
            <div style={{textAlign:"center",borderLeft:"1px solid rgba(255,255,255,0.07)",borderRight:"1px solid rgba(255,255,255,0.07)"}}><div style={{fontSize:10,opacity:0.4,marginBottom:3}}>Плановые</div><div style={{fontSize:14,fontWeight:800,color:"#60A5FA"}}>{fmt(totalPlanned)}</div></div>
            <div style={{textAlign:"center"}}><div style={{fontSize:10,opacity:0.4,marginBottom:3}}>Доходы</div><div style={{fontSize:14,fontWeight:800,color:"#43e97b"}}>+{fmt(totalIncome)}</div></div>
          </div>
          <div style={{paddingTop:12,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,opacity:0.5}}>Нужно закрыть:</span><span style={{fontSize:14,fontWeight:800,color:"#ffcb6b"}}>{fmt(grandNeed)} ₸</span></div>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,opacity:0.5}}>Осталось:</span><span style={{fontSize:14,fontWeight:800,color:unpaidTotal===0?"#43e97b":"#f5576c"}}>{fmt(unpaidTotal)} ₸</span></div>
          </div>
        </div>
      </>}

      {/* TASKS */}
      {tab==="tasks"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

                <div style={{fontSize:12,opacity:0.45,marginTop:2}}>{d.bank}</div>
              </div>
              <button onClick={()=>setEditDeposit({...d,amount:String(d.amount),target:String(d.target)})}
                style={{background:"rgba(79,172,254,0.15)",border:"1px solid rgba(79,172,254,0.3)",borderRadius:12,padding:"6px 12px",color:"#4facfe",fontSize:12,fontWeight:700,cursor:"pointer"}}>✏️ Изменить</button>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:12,fontSize:13}}>
              <span style={{color:"#4facfe",fontWeight:700}}>Вложено: {fmt(d.amount)} ₸</span>
              {d.target>0&&<span style={{opacity:0.45}}>Цель: {fmt(d.target)} ₸</span>}
            </div>
            {d.target>0&&<>
              <div style={{marginTop:8,background:"rgba(255,255,255,0.08)",borderRadius:99,height:8,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#4facfe,#00f2fe)",borderRadius:99}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:11}}>
                <span style={{opacity:0.35}}>{pct.toFixed(1)}%</span>
                <span style={{color:"#4facfe",opacity:0.6}}>осталось: {fmt(Math.max(d.target-d.amount,0))} ₸</span>
              </div>
            </>}
            {d.note&&<div style={{marginTop:8,fontSize:12,opacity:0.4,fontStyle:"italic"}}>{d.note}</div>}
          </div>;
        })}

        {/* Pension THIRD */}
        <SectionTitle style={{marginTop:8}}>🏛️ Пенсионные накопления (ЕНПФ)</SectionTitle>
        {deposits.filter(d=>d.type==="pension").map(d=>{
          const pct = d.target>0 ? Math.min((d.amount/d.target)*100,100) : 0;
          return <div key={d.id} style={{background:"#1c1c2e",borderRadius:20,padding:"16px",marginBottom:12,border:"1px solid rgba(67,233,122,0.2)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:16,fontWeight:700}}>{d.name}</div>
                <div style={{fontSize:12,opacity:0.45,marginTop:2}}>{d.bank}</div>
              </div>
              <button onClick={()=>setEditDeposit({...d,amount:String(d.amount),target:String(d.target)})}
                style={{background:"rgba(67,233,122,0.15)",border:"1px solid rgba(67,233,122,0.3)",borderRadius:12,padding:"6px 12px",color:"#43e97b",fontSize:12,fontWeight:700,cursor:"pointer"}}>✏️ Изменить</button>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:12,fontSize:13}}>
              <span style={{color:"#43e97b",fontWeight:700}}>Вложено: {fmt(d.amount)} ₸</span>
              {d.target>0&&<span style={{opacity:0.45}}>Цель: {fmt(d.target)} ₸</span>}
            </div>
            {d.target>0&&<>
              <div style={{marginTop:8,background:"rgba(255,255,255,0.08)",borderRadius:99,height:8,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#43e97b,#38f9d7)",borderRadius:99}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:11}}>
                <span style={{opacity:0.35}}>{pct.toFixed(1)}%</span>
                <span style={{color:"#43e97b",opacity:0.6}}>осталось: {fmt(Math.max(d.target-d.amount,0))} ₸</span>
              </div>
            </>}
            {d.note&&<div style={{marginTop:8,fontSize:12,opacity:0.4,fontStyle:"italic"}}>{d.note}</div>}
          </div>;
        })}

      </>}

      {/* ── MODALS ── */}

      {/* Add Goal Modal */}
      {showAddGoal&&<Modal onClose={()=>setShowAddGoal(false)} title="🎯 Новая цель">
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
          {["🏠","🚙","💎","🕌","💼","🏙️","🏘️","🌍","📈","💰"].map(e=>(
            <button key={e} onClick={()=>setNewGoal(p=>({...p,emoji:e}))}
              style={{background:newGoal.emoji===e?"rgba(247,151,30,0.3)":"#2a2a3e",border:newGoal.emoji===e?"2px solid #f7971e":"2px solid transparent",borderRadius:10,padding:"8px",fontSize:20,cursor:"pointer"}}>
              {e}
            </button>
          ))}
        </div>
        <FInput placeholder="Название цели" value={newGoal.text} onChange={v=>setNewGoal(p=>({...p,text:v}))}/>
        <FInput placeholder="Описание (необязательно)" value={newGoal.sub} onChange={v=>setNewGoal(p=>({...p,sub:v}))}/>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          {["₸","$"].map(cur=><button key={cur} onClick={()=>setNewGoal(p=>({...p,isTenge:cur==="₸"}))}
            style={{flex:1,background:(newGoal.isTenge?cur==="₸":cur==="$")?"rgba(247,151,30,0.3)":"#2a2a3e",border:(newGoal.isTenge?cur==="₸":cur==="$")?"2px solid #f7971e":"2px solid transparent",borderRadius:12,padding:"10px",fontSize:18,fontWeight:700,color:"#fff",cursor:"pointer"}}>{cur}</button>)}
        </div>
        <FInput placeholder="Уже накоплено" value={String(newGoal.saved)} onChange={v=>setNewGoal(p=>({...p,saved:v}))} type="number"/>
        <FInput placeholder="Целевая сумма" value={String(newGoal.target)} onChange={v=>setNewGoal(p=>({...p,target:v}))} type="number"/>
        <PBtn onClick={addGoal} label="Добавить цель" gradient="linear-gradient(135deg,#f7971e,#ffd200)" textColor="#0a1a00"/>
      </Modal>}

      {/* Add Deposit Modal */}
      {showAddDeposit&&<Modal onClose={()=>setShowAddDeposit(false)} title="🏦 Новый вклад">
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1}}>ТИП ВКЛАДА</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[{id:"otbasy",label:"🏠 Otbasy",color:"#F59E0B"},{id:"child",label:"👶 Aqyl",color:"#4facfe"},{id:"pension",label:"🏛️ ЕНПФ",color:"#43e97b"}].map(t=>(
            <button key={t.id} onClick={()=>setNewDeposit(p=>({...p,type:t.id,bank:t.id==="otbasy"?"Otbasy Bank":t.id==="child"?"Aqyl":"ЕНПФ"}))}
              style={{flex:1,background:newDeposit.type===t.id?t.color+"33":"#2a2a3e",border:newDeposit.type===t.id?`2px solid ${t.color}`:"2px solid transparent",borderRadius:12,padding:"10px 4px",fontSize:11,fontWeight:600,color:"#fff",cursor:"pointer"}}>
              {t.label}
            </button>
          ))}
        </div>
        <FInput placeholder="Имя / Название" value={newDeposit.name} onChange={v=>setNewDeposit(p=>({...p,name:v}))}/>
        <FInput placeholder="Банк" value={newDeposit.bank} onChange={v=>setNewDeposit(p=>({...p,bank:v}))}/>
        <FInput placeholder="Сумма вложений (₸)" value={String(newDeposit.amount)} onChange={v=>setNewDeposit(p=>({...p,amount:v}))} type="number"/>
        <FInput placeholder="Цель (₸)" value={String(newDeposit.target)} onChange={v=>setNewDeposit(p=>({...p,target:v}))} type="number"/>
        <FInput placeholder="Заметка" value={newDeposit.note} onChange={v=>setNewDeposit(p=>({...p,note:v}))}/>
        <PBtn onClick={addDeposit} label="Добавить" gradient="linear-gradient(135deg,#F59E0B,#ffd200)" textColor="#0a1a00"/>
      </Modal>}

      {/* Edit Deposit */}
      {editDeposit&&<Modal onClose={()=>setEditDeposit(null)} title={`✏️ ${editDeposit.name}`}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>БАНК / ПРОГРАММА</div>
        <FInput placeholder="Банк (напр. Aqyl, ЕНПФ)" value={editDeposit.bank||""} onChange={v=>setEditDeposit(p=>({...p,bank:v}))}/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>СУММА ВЛОЖЕНИЙ (₸)</div>
        <input type="number" placeholder="0" value={editDeposit.amount}
          onChange={e=>setEditDeposit(p=>({...p,amount:e.target.value}))}
          style={{width:"100%",background:"#2a2a3e",border:"2px solid #a3ffcf",borderRadius:14,padding:"13px 16px",fontSize:20,fontWeight:800,color:"#a3ffcf",outline:"none",boxSizing:"border-box",marginBottom:10}}/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ЦЕЛЬ (₸) — необязательно</div>
        <input type="number" placeholder="0" value={editDeposit.target}
          onChange={e=>setEditDeposit(p=>({...p,target:e.target.value}))}
          style={{width:"100%",background:"#2a2a3e",border:"2px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"13px 16px",fontSize:18,fontWeight:700,color:"#fff",outline:"none",boxSizing:"border-box",marginBottom:10}}/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ЗАМЕТКА</div>
        <FInput placeholder="Заметка (необязательно)" value={editDeposit.note||""} onChange={v=>setEditDeposit(p=>({...p,note:v}))}/>
        {Number(editDeposit.target)>0&&Number(editDeposit.amount)>0&&<div style={{background:"rgba(255,255,255,0.05)",borderRadius:14,padding:"12px 16px",marginBottom:14}}>
          <div style={{background:"rgba(255,255,255,0.08)",borderRadius:99,height:10,overflow:"hidden"}}>
            <div style={{width:`${Math.min((Number(editDeposit.amount)/Number(editDeposit.target))*100,100)}%`,height:"100%",background:"linear-gradient(90deg,#F59E0B,#ffd200)",borderRadius:99}}/>
          </div>
          <div style={{textAlign:"center",marginTop:6,fontSize:13,color:"#F59E0B",fontWeight:700}}>
            {((Number(editDeposit.amount)/Number(editDeposit.target))*100).toFixed(1)}%
          </div>
        </div>}
        <PBtn onClick={()=>saveDeposit(editDeposit)} label="Сохранить" gradient="linear-gradient(135deg,#F59E0B,#ffd200)" textColor="#0a1a00"/>
      </Modal>}

      {/* Edit Finance */}
      {editFin&&<Modal onClose={()=>setEditFin(null)} title="✏️ Редактировать запись">

        <div style={{display:"flex",gap:8,marginBottom:14}}>{FIN_TYPES.map(ft=><button key={ft.id} onClick={()=>setEditFin(p=>({...p,type:ft.id}))} style={{flex:1,background:editFin.type===ft.id?ft.color+"33":"#2a2a3e",border:editFin.type===ft.id?`2px solid ${ft.color}`:"2px solid transparent",borderRadius:12,padding:"9px 4px",cursor:"pointer",color:"#fff",fontSize:16,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>{ft.emoji}<span style={{fontSize:10}}>{ft.label}</span></button>)}</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1}}>КАТЕГОРИЯ</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:14}}>{FIN_CATS.map(c=><button key={c.id} onClick={()=>setEditFin(p=>({...p,cat:c.id}))} style={{background:editFin.cat===c.id?c.color+"44":"#2a2a3e",border:editFin.cat===c.id?`2px solid ${c.color}`:"2px solid transparent",borderRadius:12,padding:"8px 4px",cursor:"pointer",color:"#fff",fontSize:16,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>{c.emoji}<span style={{fontSize:9,opacity:0.7}}>{c.label}</span></button>)}</div>
        <FInput placeholder="Название" value={editFin.label} onChange={v=>setEditFin(p=>({...p,label:v}))}/>
        <FInput placeholder="Сумма (₸)" value={String(editFin.amount)} onChange={v=>setEditFin(p=>({...p,amount:v}))} type="number"/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:5}}>ДАТА ПЛАТЕЖА</div>
        <FInput value={editFin.date} onChange={v=>setEditFin(p=>({...p,date:v}))} type="date"/>
        <FInput placeholder="Заметка" value={editFin.note||""} onChange={v=>setEditFin(p=>({...p,note:v}))}/>
        <PBtn onClick={saveEditFin} label="Сохранить" gradient="linear-gradient(135deg,#667eea,#764ba2)"/>
      </Modal>}

      {/* Income editor */}
      {showIncomeEditor&&incomeEdit&&<Modal onClose={()=>setShowIncomeEditor(false)} title="💚 Доход месяца">
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:10,letterSpacing:1}}>ИСТОЧНИКИ ДОХОДА</div>
        {incomeEdit.sources.map((src,i)=><div key={src.id} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
          <input placeholder="Источник" value={src.label} onChange={e=>{const s=[...incomeEdit.sources];s[i]={...s[i],label:e.target.value};setIncomeEdit({sources:s});}} style={{flex:2,background:"#2a2a3e",border:"none",borderRadius:12,padding:"11px 14px",fontSize:13,color:"#fff",outline:"none",boxSizing:"border-box"}}/>
          <input placeholder="₸" type="number" value={src.amount} onChange={e=>{const s=[...incomeEdit.sources];s[i]={...s[i],amount:e.target.value};setIncomeEdit({sources:s});}} style={{flex:1,background:"#2a2a3e",border:"none",borderRadius:12,padding:"11px 14px",fontSize:13,color:"#43e97b",fontWeight:700,outline:"none",boxSizing:"border-box"}}/>
          <button onClick={()=>{const s=incomeEdit.sources.filter((_,j)=>j!==i);setIncomeEdit({sources:s});}} style={{background:"rgba(255,100,100,0.1)",border:"none",borderRadius:10,padding:"10px 12px",color:"#f5576c",cursor:"pointer",fontSize:15}}>×</button>
        </div>)}
        <button onClick={()=>setIncomeEdit(p=>({sources:[...p.sources,{id:Date.now(),label:"",amount:""}]}))} style={{width:"100%",background:"rgba(67,233,122,0.1)",border:"1px dashed rgba(67,233,122,0.3)",borderRadius:14,padding:"11px",fontSize:13,color:"#43e97b",cursor:"pointer",marginBottom:14,fontWeight:600}}>+ Добавить источник</button>
        {incomeEdit.sources.length>0&&<div style={{background:"rgba(67,233,122,0.08)",borderRadius:14,padding:"12px 16px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,opacity:0.6}}>Итого:</span>
          <span style={{fontSize:22,fontWeight:800,color:"#43e97b"}}>{fmt(incomeEdit.sources.reduce((s,x)=>s+Number(x.amount||0),0))} ₸</span>
        </div>}
        <PBtn onClick={()=>{saveMonthIncome(incomeEdit.sources);setShowIncomeEditor(false);}} label="Сохранить" gradient="linear-gradient(135deg,#11998e,#43e97b)" textColor="#0a2018"/>
      </Modal>}

      {/* Add Finance */}
      {showAddFin&&<Modal onClose={()=>setShowAddFin(false)} title="Новая запись">
        <div style={{display:"flex",gap:8,marginBottom:14}}>{FIN_TYPES.map(ft=><button key={ft.id} onClick={()=>setNewFin(p=>({...p,type:ft.id}))} style={{flex:1,background:newFin.type===ft.id?ft.color+"33":"#2a2a3e",border:newFin.type===ft.id?`2px solid ${ft.color}`:"2px solid transparent",borderRadius:12,padding:"10px 4px",cursor:"pointer",color:"#fff",fontSize:18,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>{ft.emoji}<span style={{fontSize:10}}>{ft.label}</span></button>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>{FIN_CATS.map(c=><button key={c.id} onClick={()=>setNewFin(p=>({...p,cat:c.id}))} style={{background:newFin.cat===c.id?c.color+"44":"#2a2a3e",border:newFin.cat===c.id?`2px solid ${c.color}`:"2px solid transparent",borderRadius:12,padding:"8px 4px",cursor:"pointer",color:"#fff",fontSize:18,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>{c.emoji}<span style={{fontSize:9,opacity:0.7}}>{c.label}</span></button>)}</div>
        <FInput placeholder="Название" value={newFin.label} onChange={v=>setNewFin(p=>({...p,label:v}))}/>
        <FInput placeholder="Сумма (₸)" value={newFin.amount} onChange={v=>setNewFin(p=>({...p,amount:v}))} type="number"/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:5}}>ДАТА ПЛАТЕЖА</div>
        <FInput value={newFin.date} onChange={v=>setNewFin(p=>({...p,date:v}))} type="date"/>
        <FInput placeholder="Заметка" value={newFin.note} onChange={v=>setNewFin(p=>({...p,note:v}))}/>
        <PBtn onClick={addFinance} label="Добавить" gradient="linear-gradient(135deg,#11998e,#38ef7d)" textColor="#0a2018"/>
      </Modal>}

      {/* Add Task */}
      {showAddTask&&<Modal onClose={()=>setShowAddTask(false)} title="Новая задача">
        <FInput placeholder="Что нужно сделать?" value={newTask.text} onChange={v=>setNewTask(p=>({...p,text:v}))}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          {Object.keys(CAT_COLORS).map(c=><button key={c} onClick={()=>setNewTask(p=>({...p,category:c}))} style={{background:newTask.category===c?CAT_COLORS[c]+"44":"#2a2a3e",border:newTask.category===c?`2px solid ${CAT_COLORS[c]}`:"2px solid transparent",borderRadius:12,padding:"7px 14px",fontSize:12,fontWeight:600,color:"#fff",cursor:"pointer"}}>{CAT_EMOJI[c]} {c}</button>)}
        </div>
        <FInput placeholder="Заметка" value={newTask.note} onChange={v=>setNewTask(p=>({...p,note:v}))}/>
        <PBtn onClick={addTask} label="Добавить" gradient="linear-gradient(135deg,#4facfe,#00f2fe)"/>
      </Modal>}

      {/* Rollover */}
      {showRollover&&<Modal onClose={()=>setShowRollover(false)} title={`🔄 Перенести на ${getMonthLabel(currentMonth+1)}`}>
        {mFin.filter(f=>f.type==="planned"&&!f.paid).length>0&&<>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1}}>НЕОПЛАЧЕННЫЕ ПЛАТЕЖИ</div>
          {mFin.filter(f=>f.type==="planned"&&!f.paid).map(f=><div key={f.id} onClick={()=>setRolloverSel(s=>({...s,finances:s.finances.includes(f.id)?s.finances.filter(x=>x!==f.id):[...s.finances,f.id]}))} style={{display:"flex",alignItems:"center",gap:12,background:rolloverSel.finances.includes(f.id)?"rgba(96,165,250,0.15)":"#2a2a3e",borderRadius:14,padding:"11px 14px",marginBottom:8,cursor:"pointer",border:rolloverSel.finances.includes(f.id)?"1px solid #60A5FA":"1px solid transparent"}}>
            <div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${rolloverSel.finances.includes(f.id)?"#60A5FA":"rgba(255,255,255,0.2)"}`,background:rolloverSel.finances.includes(f.id)?"#60A5FA":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>{rolloverSel.finances.includes(f.id)?"✓":""}</div>
            <div style={{flex:1,fontSize:13,fontWeight:600}}>{f.label}</div>
            <div style={{fontSize:12,color:"#60A5FA",fontWeight:700}}>{fmt(f.amount)} ₸</div>
          </div>)}
        </>}
        {mTasks.filter(t=>t.status!=="Готово").length>0&&<>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:8,marginTop:14,letterSpacing:1}}>НЕЗАВЕРШЁННЫЕ ДЕЛА</div>
          {mTasks.filter(t=>t.status!=="Готово").map(t=><div key={t.id} onClick={()=>setRolloverSel(s=>({...s,tasks:s.tasks.includes(t.id)?s.tasks.filter(x=>x!==t.id):[...s.tasks,t.id]}))} style={{display:"flex",alignItems:"center",gap:12,background:rolloverSel.tasks.includes(t.id)?"rgba(79,172,254,0.15)":"#2a2a3e",borderRadius:14,padding:"11px 14px",marginBottom:8,cursor:"pointer",border:rolloverSel.tasks.includes(t.id)?"1px solid #4facfe":"1px solid transparent"}}>
            <div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${rolloverSel.tasks.includes(t.id)?"#4facfe":"rgba(255,255,255,0.2)"}`,background:rolloverSel.tasks.includes(t.id)?"#4facfe":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>{rolloverSel.tasks.includes(t.id)?"✓":""}</div>
            <div style={{flex:1,fontSize:13,fontWeight:600}}>{t.text}</div>
            <div style={{fontSize:10,color:CAT_COLORS[t.category]||"#888",background:(CAT_COLORS[t.category]||"#888")+"22",borderRadius:6,padding:"2px 7px"}}>{t.category}</div>
          </div>)}
        </>}
        <div style={{marginTop:16}}><PBtn onClick={doRollover} label={`Перенести → ${getMonthLabel(currentMonth+1)}`} gradient="linear-gradient(135deg,#f7971e,#ffd200)" textColor="#0a1a00"/></div>
      </Modal>}

      {/* Add Position */}
      {showAddPos&&<Modal onClose={()=>setShowAddPos(false)} title={`Новая позиция — ${INV_PORTFOLIOS.find(p=>p.id===newPos.portfolio)?.emoji} ${INV_PORTFOLIOS.find(p=>p.id===newPos.portfolio)?.label}`}>
        {/* Portfolio selector */}
        <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:16,paddingBottom:4}}>
          {INV_PORTFOLIOS.map(p=><button key={p.id} onClick={()=>setNewPos(prev=>({...prev,portfolio:p.id,platform:p.platform||""}))}
            style={{flexShrink:0,background:newPos.portfolio===p.id?p.color+"44":"#2a2a3e",border:newPos.portfolio===p.id?`2px solid ${p.color}`:"2px solid transparent",borderRadius:12,padding:"8px 12px",cursor:"pointer",color:"#fff",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:16}}>{p.emoji}</span>{p.label}
          </button>)}
        </div>

        {/* Stock/Crypto fields */}
        {["us","kz","crypto"].includes(newPos.portfolio)&&<>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            {["Binance","Tradernet"].map(pl=><button key={pl} onClick={()=>setNewPos(p=>({...p,platform:pl}))}
              style={{flex:1,background:newPos.platform===pl?"rgba(167,139,250,0.3)":"#2a2a3e",border:newPos.platform===pl?"2px solid #A78BFA":"2px solid transparent",borderRadius:12,padding:"8px",fontSize:12,fontWeight:600,color:"#fff",cursor:"pointer"}}>
              {pl==="Binance"?"💎":"📊"} {pl}
            </button>)}
          </div>
          <FInput placeholder="Тикер (BTC, AAPL, KZTK...)" value={newPos.ticker} onChange={v=>setNewPos(p=>({...p,ticker:v.toUpperCase()}))}/>
          <FInput placeholder="Название (необязательно)" value={newPos.name} onChange={v=>setNewPos(p=>({...p,name:v}))}/>
          <FInput placeholder="Количество" value={newPos.qty} onChange={v=>setNewPos(p=>({...p,qty:v}))} type="number"/>
          <FInput placeholder="Средняя цена покупки" value={newPos.avgPrice} onChange={v=>setNewPos(p=>({...p,avgPrice:v}))} type="number"/>
          <FInput placeholder="Текущая цена" value={newPos.currentPrice} onChange={v=>setNewPos(p=>({...p,currentPrice:v}))} type="number"/>
        </>}

        {/* Business/Realty fields */}
        {["business","realty"].includes(newPos.portfolio)&&<>
          <FInput placeholder={newPos.portfolio==="realty"?"Название объекта (напр. Квартира Актобе)":"Название проекта (напр. Салон красоты)"} value={newPos.name} onChange={v=>setNewPos(p=>({...p,name:v,ticker:v.slice(0,10)}))}/>
          <FInput placeholder="Описание / заметка" value={newPos.ticker===newPos.name.slice(0,10)?"":(newPos.ticker||"")} onChange={v=>setNewPos(p=>({...p,ticker:v}))}/>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ВЛОЖЕНО (₸)</div>
          <FInput placeholder="Сумма вложений" value={newPos.avgPrice} onChange={v=>setNewPos(p=>({...p,avgPrice:v,qty:"1"}))} type="number"/>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ТЕКУЩАЯ СТОИМОСТЬ (₸)</div>
          <FInput placeholder="Текущая стоимость" value={newPos.currentPrice} onChange={v=>setNewPos(p=>({...p,currentPrice:v}))} type="number"/>
        </>}

        <PBtn onClick={addPosition} label="Добавить" gradient={`linear-gradient(135deg,${INV_PORTFOLIOS.find(p=>p.id===newPos.portfolio)?.color||"#A78BFA"},#6d28d9)`}/>
      </Modal>}

      {/* Edit Position */}
      {editPos&&<Modal onClose={()=>setEditPos(null)} title={`✏️ ${editPos.name||editPos.ticker}`}>
        {/* Stock/Crypto */}
        {["us","kz","crypto"].includes(editPos.portfolio)&&<>
          <FInput placeholder="Количество" value={String(editPos.qty)} onChange={v=>setEditPos(p=>({...p,qty:v}))} type="number"/>
          <FInput placeholder="Средняя цена" value={String(editPos.avgPrice)} onChange={v=>setEditPos(p=>({...p,avgPrice:v}))} type="number"/>
          <FInput placeholder="Текущая цена" value={String(editPos.currentPrice)} onChange={v=>setEditPos(p=>({...p,currentPrice:v}))} type="number"/>
        </>}
        {/* Business/Realty */}
        {["business","realty"].includes(editPos.portfolio)&&<>
          <FInput placeholder="Название" value={editPos.name||""} onChange={v=>setEditPos(p=>({...p,name:v}))}/>
          <FInput placeholder="Описание / заметка" value={editPos.ticker||""} onChange={v=>setEditPos(p=>({...p,ticker:v}))}/>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ВЛОЖЕНО (₸)</div>
          <FInput placeholder="Сумма вложений" value={String(editPos.avgPrice)} onChange={v=>setEditPos(p=>({...p,avgPrice:v}))} type="number"/>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ТЕКУЩАЯ СТОИМОСТЬ (₸)</div>
          <FInput placeholder="Текущая стоимость" value={String(editPos.currentPrice)} onChange={v=>setEditPos(p=>({...p,currentPrice:v}))} type="number"/>
        </>}
        <PBtn onClick={saveEditPos} label="Сохранить" gradient={`linear-gradient(135deg,${INV_PORTFOLIOS.find(p=>p.id===editPos.portfolio)?.color||"#A78BFA"},#6d28d9)`}/>
      </Modal>}

      {/* Edit Inv Goal */}
      {editInvGoal&&<Modal onClose={()=>setEditInvGoal(null)} title={`✏️ ${INV_PORTFOLIOS.find(p=>p.id===editInvGoal.portfolio)?.emoji} ${INV_PORTFOLIOS.find(p=>p.id===editInvGoal.portfolio)?.label}`}>
        {/* Currency selector */}
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1}}>ВАЛЮТА</div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {["₸","$","€","£"].map(cur=>(
            <button key={cur} onClick={()=>setEditInvGoal(p=>({...p,currency:cur}))}
              style={{flex:1,background:editInvGoal.currency===cur?"rgba(167,139,250,0.3)":"#2a2a3e",border:editInvGoal.currency===cur?"2px solid #A78BFA":"2px solid transparent",borderRadius:12,padding:"10px 4px",cursor:"pointer",color:editInvGoal.currency===cur?"#fff":"rgba(255,255,255,0.5)",fontSize:18,fontWeight:700}}>
              {cur}
            </button>
          ))}
        </div>
        {/* Deposited */}
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ВЛОЖЕНО СЕЙЧАС</div>
        <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center"}}>
          <input type="number" placeholder="0" value={String(editInvGoal.deposited)}
            onChange={e=>setEditInvGoal(p=>({...p,deposited:e.target.value}))}
            style={{flex:1,background:"#2a2a3e",border:"2px solid #a3ffcf",borderRadius:14,padding:"13px 16px",fontSize:18,fontWeight:700,color:"#a3ffcf",outline:"none",boxSizing:"border-box"}}/>
          <span style={{fontSize:18,fontWeight:700,opacity:0.6,minWidth:24}}>{editInvGoal.currency}</span>
        </div>
        {/* Target */}
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>ЦЕЛЕВАЯ СУММА (необязательно)</div>
        <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center"}}>
          <input type="number" placeholder="0" value={String(editInvGoal.target)}
            onChange={e=>setEditInvGoal(p=>({...p,target:e.target.value}))}
            style={{flex:1,background:"#2a2a3e",border:"2px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"13px 16px",fontSize:18,fontWeight:700,color:"#fff",outline:"none",boxSizing:"border-box"}}/>
          <span style={{fontSize:18,fontWeight:700,opacity:0.6,minWidth:24}}>{editInvGoal.currency}</span>
        </div>
        {/* Live progress */}
        {Number(editInvGoal.target)>0&&<div style={{background:"#2a2a3e",borderRadius:16,padding:"14px",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:8}}>
            <span style={{opacity:0.5}}>До цели</span>
            <span style={{fontWeight:700,color:"#A78BFA"}}>{Math.min((Number(editInvGoal.deposited)/Number(editInvGoal.target))*100,100).toFixed(1)}%</span>
          </div>
          <div style={{background:"rgba(255,255,255,0.08)",borderRadius:99,height:10,overflow:"hidden"}}>
            <div style={{width:`${Math.min((Number(editInvGoal.deposited)/Number(editInvGoal.target))*100,100)}%`,height:"100%",background:"linear-gradient(90deg,#A78BFA,#ffd200)",borderRadius:99}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:11,opacity:0.45}}>
            <span>Вложено: {fmt(Number(editInvGoal.deposited))} {editInvGoal.currency}</span>
            <span>Осталось: {fmt(Math.max(Number(editInvGoal.target)-Number(editInvGoal.deposited),0))} {editInvGoal.currency}</span>
          </div>
        </div>}
        <PBtn onClick={saveInvGoal} label="Сохранить" gradient="linear-gradient(135deg,#A78BFA,#6d28d9)"/>
      </Modal>}

      {/* Edit Goal */}
      {editGoal&&<Modal onClose={()=>setEditGoal(null)} title={`${editGoal.emoji} ${editGoal.text}`}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:5}}>УЖЕ НАКОПЛЕНО</div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <input type="number" value={savedInput} onChange={e=>setSavedInput(e.target.value)} placeholder="0" style={{flex:1,background:"#2a2a3e",border:"2px solid #a3ffcf",borderRadius:14,padding:"13px 16px",fontSize:17,fontWeight:700,color:"#a3ffcf",outline:"none",boxSizing:"border-box"}}/>
          <span style={{fontSize:15,opacity:0.5}}>{editGoal.isTenge?"₸":"$"}</span>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:5}}>ЦЕЛЕВАЯ СУММА</div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
          <input type="number" value={targetInput} onChange={e=>setTargetInput(e.target.value)} placeholder="0" style={{flex:1,background:"#2a2a3e",border:"2px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"13px 16px",fontSize:17,fontWeight:700,color:"#fff",outline:"none",boxSizing:"border-box"}}/>
          <span style={{fontSize:15,opacity:0.5}}>{editGoal.isTenge?"₸":"$"}</span>
        </div>
        {Number(targetInput)>0&&<div style={{marginBottom:16}}>
          <div style={{background:"rgba(255,255,255,0.08)",borderRadius:99,height:10,overflow:"hidden"}}><div style={{width:`${Math.min((Number(savedInput)/Number(targetInput))*100,100)}%`,height:"100%",background:"linear-gradient(90deg,#f7971e,#ffd200)",borderRadius:99}}/></div>
          <div style={{textAlign:"center",marginTop:5,fontSize:12,color:"#ffd200",fontWeight:600}}>{((Number(savedInput)/Number(targetInput))*100).toFixed(1)}%</div>
        </div>}
        <PBtn onClick={saveGoal} label="Сохранить" gradient="linear-gradient(135deg,#f7971e,#ffd200)" textColor="#0a1a00"/>
      </Modal>}

    </div>

    {/* Bottom Nav */}
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(15,15,26,0.96)",backdropFilter:"blur(20px)",borderTop:"1px solid rgba(255,255,255,0.07)",display:"flex",padding:"8px 2px 22px"}}>
      {[
        {id:"dashboard",emoji:"🏠",label:"Главная",acc:"#667eea"},
        {id:"tasks",    emoji:"📋",label:"Дела",   acc:"#4facfe"},
        {id:"finance",  emoji:"💳",label:"Финансы",acc:"#38ef7d"},
        {id:"invest",   emoji:"📈",label:"Инвест", acc:"#A78BFA"},
        {id:"goals",    emoji:"🎯",label:"Цели",   acc:"#f7971e"},
        {id:"deposits", emoji:"🏦",label:"Вклады", acc:"#F59E0B"},
      ].map(item=>{
        const active=tab===item.id;
        return <button key={item.id} onClick={()=>setTab(item.id)} style={{flex:1,minWidth:0,background:"none",border:"none",cursor:"pointer",padding:"5px 1px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:active?"#fff":"rgba(255,255,255,0.28)"}}>
          <span style={{fontSize:18,filter:active?"none":"grayscale(1)",lineHeight:1}}>{item.emoji}</span>
          <span style={{fontSize:8,fontWeight:active?700:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%"}}>{item.label}</span>
          {active&&<div style={{width:3,height:3,borderRadius:"50%",background:item.acc}}/>}
        </button>;
      })}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
